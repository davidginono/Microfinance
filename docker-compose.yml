services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sacco
      POSTGRES_USER: sacco
      POSTGRES_PASSWORD: sacco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sacco
      SPRING_DATASOURCE_USERNAME: sacco
      SPRING_DATASOURCE_PASSWORD: sacco
    ports:
      - "8080:8080"

volumes:
  pgdata:

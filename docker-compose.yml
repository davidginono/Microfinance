services:
  app:
    build:
      context: .
      target: final
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sacco
      SPRING_DATASOURCE_USERNAME: sacco
      SPRING_DATASOURCE_PASSWORD: sacco_dev_password
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sacco
      POSTGRES_USER: sacco
      POSTGRES_PASSWORD: sacco_dev_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco -d sacco"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

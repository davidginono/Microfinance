adjustment.effect.PROVISION=Posts the change needed to reach the allowance balance you enter. This does not reduce the client's debt. Use the institution's approved assessment; reference estimates are not automatically posted.
adjustment.effect.WRITE_OFF=Writes off all remaining principal against its fully posted allowance. Contractual debt and unpaid interest remain recorded; no payment or debt forgiveness is created. Future scheduled interest is not posted as a loss.
adjustment.effect.WRITE_BACK=Reinstates the linked principal and allowance entries. No money is received. Record any actual recovery separately through a loan repayment receipt after this request is posted.
adjustment.effect.DISBURSEMENT_REVERSAL=Offsets the full original disbursement and closes this loan as Disbursement reversed. Requires evidence that no funds remain with the client, no repayment history and no remaining allowance. The original loan and schedule remain as history; a new disbursement needs a new application.

spring:
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost/sacco}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:qwerty1!}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    open-in-view: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: ${SPRING_WEB_RESOURCES_CACHE_PERIOD:0}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:davidginono625@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:xgii umdj qghc egyp}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:rwexcfvghbj}
            client-secret: ${GOOGLE_CLIENT_SECRET:werxtcfvghbj}
            scope: openid,email,profile
  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:true}
    livereload:
      enabled: ${SPRING_DEVTOOLS_LIVERELOAD_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:2KB}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:300}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:1000}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
        same-site: lax
    jsp:
      init-parameters:
        development: ${SERVER_SERVLET_JSP_DEVELOPMENT:true}

logging:
  level:
    org.springframework.security: INFO
    com.sacco.mvp: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  uploads:
    legacy-migration-enabled: ${APP_UPLOADS_LEGACY_MIGRATION_ENABLED:false}
  outbox:
    scheduler-enabled: ${APP_OUTBOX_SCHEDULER_ENABLED:true}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:250}
    fixed-delay-ms: ${APP_OUTBOX_FIXED_DELAY_MS:500}
  application-numbers:
    block-size: ${APP_APPLICATION_NUMBERS_BLOCK_SIZE:100}
  upload-migration:
    enabled: ${APP_UPLOAD_MIGRATION_ENABLED:false}
    loan-root: ${APP_UPLOAD_MIGRATION_LOAN_ROOT:loan-uploads/applications}
    logo-root: ${APP_UPLOAD_MIGRATION_LOGO_ROOT:branding/sacco-logos}
  loan-payments:
    sync-enabled: ${APP_LOAN_PAYMENTS_SYNC_ENABLED:true}
    sync-cron: "${APP_LOAN_PAYMENTS_SYNC_CRON:0 0 10 1 * *}"
    recent-sync-cron: "${APP_LOAN_PAYMENTS_RECENT_SYNC_CRON:0 0 6-21/3 * * *}"
    sync-page-size: ${APP_LOAN_PAYMENTS_SYNC_PAGE_SIZE:100}
    sync-zone: ${APP_LOAN_PAYMENTS_SYNC_ZONE:Africa/Nairobi}
  sms:
    enabled: ${APP_SMS_ENABLED:true}
    connect-timeout: ${APP_SMS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APP_SMS_READ_TIMEOUT:8s}
    benter:
      base-url: ${APP_SMS_BENTER_BASE_URL:https://api.onfonmedia.co.ke}
      send-path: ${APP_SMS_BENTER_SEND_PATH:/v1/sms/SendBulkSMS}
      client-id: ${APP_SMS_BENTER_CLIENT_ID:foresight}
      api-key: ${APP_SMS_BENTER_API_KEY:Lm4HhIKNO8wl7TVzRAnoicjr02g6Euv9aS5FZMCWUqx3BQk1}
      sender-id: ${APP_SMS_BENTER_SENDER_ID:FORESIGHT}
  retention:
    cleanup-enabled: ${APP_RETENTION_CLEANUP_ENABLED:true}
    cleanup-cron: "${APP_RETENTION_CLEANUP_CRON:0 30 2 * * *}"
    audit-log-days: ${APP_RETENTION_AUDIT_LOG_DAYS:70}
    outbox-days: ${APP_RETENTION_OUTBOX_DAYS:70}
  auth:
    google-sso:
      enabled: ${APP_AUTH_GOOGLE_SSO_ENABLED:false}
    otp:
      ttl-minutes: ${APP_AUTH_OTP_TTL_MINUTES:10}
    invitation:
      ttl-hours: ${APP_AUTH_INVITATION_TTL_HOURS:72}
    local-dev-minor-admin-password-login-enabled: ${APP_AUTH_LOCAL_DEV_MINOR_ADMIN_PASSWORD_LOGIN_ENABLED:true}
    local-dev-minor-admin-password: ${APP_AUTH_LOCAL_DEV_MINOR_ADMIN_PASSWORD:DevMinor123!}

external:
  foresight:
    base-url: ${EXTERNAL_FORESIGHT_BASE_URL:https://api.foresightfin.app}
  memberportal:
    base-url: ${EXTERNAL_MEMBERPORTAL_BASE_URL:https://api.foresightfin.app}
    connect-timeout: ${EXTERNAL_MEMBERPORTAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_MEMBERPORTAL_READ_TIMEOUT:8s}

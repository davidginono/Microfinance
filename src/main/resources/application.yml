spring:
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sacco}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    open-in-view: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: ${SPRING_WEB_RESOURCES_CACHE_PERIOD:3600}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}

server:
  port: 8080
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
        same-site: lax
    jsp:
      init-parameters:
        development: ${SERVER_SERVLET_JSP_DEVELOPMENT:false}

logging:
  level:
    org.springframework.security: INFO
    com.sacco.mvp: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  seed:
    demo-data-enabled: ${APP_SEED_DEMO_DATA_ENABLED:false}
  outbox:
    scheduler-enabled: true
    batch-size: ${APP_OUTBOX_BATCH_SIZE:250}
    fixed-delay-ms: ${APP_OUTBOX_FIXED_DELAY_MS:500}
  application-numbers:
    block-size: ${APP_APPLICATION_NUMBERS_BLOCK_SIZE:100}
  loan-payments:
    sync-enabled: true
    sync-cron: "0 0 10 1 * *"
    sync-zone: "Africa/Nairobi"
  retention:
    cleanup-enabled: true
    cleanup-cron: "0 30 2 * * *"
    audit-log-days: 70
    outbox-days: 70
  auth:
    otp:
      ttl-minutes: 10
    invitation:
      ttl-hours: ${APP_AUTH_INVITATION_TTL_HOURS:72}

external:
  foresight:
    base-url: ${EXTERNAL_FORESIGHT_BASE_URL:https://api.foresightfin.app}
  memberportal:
    base-url: ${EXTERNAL_MEMBERPORTAL_BASE_URL:https://api.foresightfin.app}

spring:
  config:
    import: optional:file:./application-local.yml
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sacco}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    open-in-view: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: 0
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}

server:
  port: 8080
  servlet:
    jsp:
      init-parameters:
        development: true

logging:
  level:
    org.springframework.security: INFO
    com.sacco.mvp: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  seed:
    demo-data-enabled: ${APP_SEED_DEMO_DATA_ENABLED:false}
  outbox:
    scheduler-enabled: true
  loan-payments:
    sync-enabled: true
    sync-cron: "0 0 10 1 * *"
    sync-zone: "Africa/Nairobi"
  retention:
    cleanup-enabled: true
    cleanup-cron: "0 30 2 * * *"
    audit-log-days: 70
    outbox-days: 70
  auth:
    otp:
      ttl-minutes: 10
    invitation:
      ttl-hours: ${APP_AUTH_INVITATION_TTL_HOURS:72}

external:
  foresight:
    base-url: ${EXTERNAL_FORESIGHT_BASE_URL:https://api.foresightfin.app}
  memberportal:
    base-url: ${EXTERNAL_MEMBERPORTAL_BASE_URL:https://api.foresightfin.app}

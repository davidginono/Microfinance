spring:
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sacco}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    open-in-view: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: ${SPRING_WEB_RESOURCES_CACHE_PERIOD:3600}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:rwexcfvghbj}
            client-secret: ${GOOGLE_CLIENT_SECRET:werxtcfvghbj}
            scope: openid,email,profile

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:2KB}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:300}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:1000}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
        same-site: lax
    jsp:
      init-parameters:
        development: ${SERVER_SERVLET_JSP_DEVELOPMENT:false}

logging:
  level:
    org.springframework.security: INFO
    com.sacco.mvp: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  seed:
    demo-data-enabled: ${APP_SEED_DEMO_DATA_ENABLED:false}
  outbox:
    scheduler-enabled: true
    batch-size: ${APP_OUTBOX_BATCH_SIZE:250}
    fixed-delay-ms: ${APP_OUTBOX_FIXED_DELAY_MS:500}
  application-numbers:
    block-size: ${APP_APPLICATION_NUMBERS_BLOCK_SIZE:100}
  loan-payments:
    sync-enabled: true
    sync-cron: "0 0 10 1 * *"
    sync-zone: "Africa/Nairobi"
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    connect-timeout: ${APP_SMS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APP_SMS_READ_TIMEOUT:8s}
    benter:
      base-url: ${APP_SMS_BENTER_BASE_URL:https://api.onfonmedia.co.ke}
      send-path: ${APP_SMS_BENTER_SEND_PATH:/v1/sms/SendBulkSMS}
      client-id: ${APP_SMS_BENTER_CLIENT_ID:}
      api-key: ${APP_SMS_BENTER_API_KEY:}
      access-key: ${APP_SMS_BENTER_ACCESS_KEY:}
      sender-id: ${APP_SMS_BENTER_SENDER_ID:INFO}
  retention:
    cleanup-enabled: true
    cleanup-cron: "0 30 2 * * *"
    audit-log-days: 70
    outbox-days: 70
  auth:
    google-sso:
      enabled: ${APP_AUTH_GOOGLE_SSO_ENABLED:false}
    otp:
      ttl-minutes: 10
    invitation:
      ttl-hours: ${APP_AUTH_INVITATION_TTL_HOURS:72}

external:
  foresight:
    base-url: ${EXTERNAL_FORESIGHT_BASE_URL:https://api.foresightfin.app}
  memberportal:
    base-url: ${EXTERNAL_MEMBERPORTAL_BASE_URL:https://api.foresightfin.app}
    connect-timeout: ${EXTERNAL_MEMBERPORTAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_MEMBERPORTAL_READ_TIMEOUT:8s}

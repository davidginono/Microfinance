adjustment.effect.DISBURSEMENT_REVERSAL=Hutengua utoaji wote wa awali na kufunga mkopo huu kwa hali ya utoaji uliotenguliwa. Inahitaji ushahidi kuwa hakuna fedha iliyobaki kwa mteja, hakuna historia ya marejesho wala akiba ya hasara iliyobaki. Mkopo na ratiba ya awali hubaki kama historia; utoaji mpya unahitaji ombi jipya.

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  web:
    resources:
      cache:
        period: 0

server:
  servlet:
    jsp:
      init-parameters:
        development: true

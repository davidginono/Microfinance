# Optional host-independent production containers with colocated Postgres.
# Persistent named volumes hold database data, uploads and institution files.
# Default image/runtime is linux/amd64. No Mailpit, no published Postgres port.

services:
  app:
    platform: linux/amd64
    build:
      context: .
      target: final
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1150m
    cpus: "1.25"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Nairobi}
      TZ: ${APP_TIME_ZONE:-Africa/Nairobi}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sacco}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sacco}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_SECRETS_ENCRYPTION_KEY: ${APP_SECRETS_ENCRYPTION_KEY:-}
      APP_UPLOADS_FILES_ROOT: /var/lib/saccos-lms/uploads
      APP_SACCOS_FILES_ROOT: /var/lib/saccos-lms/saccos
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/var/lib/saccos-lms/uploads
      - institution-files:/var/lib/saccos-lms/saccos
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.6"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sacco}
      POSTGRES_USER: ${POSTGRES_USER:-sacco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${APP_TIME_ZONE:-Africa/Nairobi}
      PGTZ: ${APP_TIME_ZONE:-Africa/Nairobi}
    command:
      - postgres
      - -c
      - timezone=${APP_TIME_ZONE:-Africa/Nairobi}
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - wal_buffers=4MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sacco} -d ${POSTGRES_DB:-sacco}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"

volumes:
  postgres-data:
  uploads:
  institution-files:

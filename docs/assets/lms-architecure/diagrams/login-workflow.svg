<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Login workflow</title>
  <desc id="desc">Member or staff login flow with privileged staff MFA and workspace landing.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font: 700 27px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .box { fill: #ffffff; stroke: #7ea8b7; stroke-width: 2; rx: 18; }
      .accent { fill: #eff7f8; stroke: #2d7a87; stroke-width: 2; rx: 18; }
      .warn { fill: #fff8ef; stroke: #d4b36a; stroke-width: 2; rx: 18; }
      .boxTitle { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .text { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #4c6570; }
      .arrow { stroke: #6f93a2; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6f93a2"/>
    </marker>
  </defs>
  <rect width="1200" height="340" class="bg"/>
  <text x="70" y="62" class="title">Workflow 1: Login</text>
  <rect x="70" y="118" width="180" height="78" class="accent"/>
  <text x="96" y="149" class="boxTitle">Open Login Page</text>
  <text x="96" y="169" class="text">Choose member or staff tab</text>

  <rect x="300" y="118" width="190" height="78" class="box"/>
  <text x="326" y="149" class="boxTitle">Select Sign-In Method</text>
  <text x="326" y="169" class="text">Password login or email OTP login</text>

  <rect x="540" y="118" width="190" height="78" class="box"/>
  <text x="566" y="149" class="boxTitle">Validate Identity</text>
  <text x="566" y="169" class="text">Account status, role fit, OTP validity</text>

  <rect x="780" y="118" width="190" height="78" class="warn"/>
  <text x="806" y="149" class="boxTitle">Apply Staff MFA When Needed</text>
  <text x="806" y="169" class="text">Privileged admin-class password logins</text>

  <rect x="1020" y="118" width="120" height="78" class="accent"/>
  <text x="1046" y="149" class="boxTitle">Enter Workspace</text>
  <text x="1046" y="169" class="text">Session starts</text>

  <path d="M250 157 L300 157" class="arrow"/>
  <path d="M490 157 L540 157" class="arrow"/>
  <path d="M730 157 L780 157" class="arrow"/>
  <path d="M970 157 L1020 157" class="arrow"/>
</svg>

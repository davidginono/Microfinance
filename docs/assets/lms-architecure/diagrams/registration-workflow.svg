<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Registration workflow</title>
  <desc id="desc">Member registration flow from profile entry to OTP confirmation and local account creation.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font: 700 27px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .box { fill: #ffffff; stroke: #7ea8b7; stroke-width: 2; rx: 18; }
      .accent { fill: #eff7f8; stroke: #2d7a87; stroke-width: 2; rx: 18; }
      .warn { fill: #fff8ef; stroke: #d4b36a; stroke-width: 2; rx: 18; }
      .boxTitle { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .text { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #4c6570; }
      .arrow { stroke: #6f93a2; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6f93a2"/>
    </marker>
  </defs>
  <rect width="1200" height="340" class="bg"/>
  <text x="70" y="62" class="title">Workflow 2: Registration</text>
  <rect x="70" y="118" width="180" height="78" class="accent"/>
  <text x="96" y="149" class="boxTitle">Enter Registration Details</text>
  <text x="96" y="169" class="text">Member number, SACCO, station, email, signature</text>

  <rect x="300" y="118" width="200" height="78" class="box"/>
  <text x="326" y="149" class="boxTitle">Verify External Member Profile</text>
  <text x="326" y="169" class="text">Cross-check member number, SACCO, and station</text>

  <rect x="550" y="118" width="170" height="78" class="warn"/>
  <text x="576" y="149" class="boxTitle">Send Registration OTP</text>
  <text x="576" y="169" class="text">Code goes to verified email address</text>

  <rect x="770" y="118" width="180" height="78" class="box"/>
  <text x="796" y="149" class="boxTitle">Consume OTP and Create Account</text>
  <text x="796" y="169" class="text">Member, savings, and settings records created</text>

  <rect x="1000" y="118" width="140" height="78" class="accent"/>
  <text x="1026" y="149" class="boxTitle">Registration Complete</text>
  <text x="1026" y="169" class="text">User can sign in</text>

  <path d="M250 157 L300 157" class="arrow"/>
  <path d="M500 157 L550 157" class="arrow"/>
  <path d="M720 157 L770 157" class="arrow"/>
  <path d="M950 157 L1000 157" class="arrow"/>
</svg>

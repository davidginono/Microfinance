<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Authentication flow</title>
  <desc id="desc">Member and staff authentication paths with OTP and staff MFA step-up.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .panel { fill: #ffffff; stroke: #c8d9e4; stroke-width: 2; rx: 24; }
      .primary { fill: #edf6f7; stroke: #2d7a87; stroke-width: 2; rx: 18; }
      .secondary { fill: #fffdf7; stroke: #d4b36a; stroke-width: 2; rx: 18; }
      .decision { fill: #fff; stroke: #7ea8b7; stroke-width: 2; }
      .title { font: 700 29px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #4c6570; }
      .boxTitle { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .boxText { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #4c6570; }
      .arrow { stroke: #6f93a2; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6f93a2"/>
    </marker>
  </defs>
  <rect width="1200" height="470" class="bg"/>
  <text x="70" y="68" class="title">Authentication and Verification Design</text>
  <text x="70" y="96" class="subtitle">All sign-in paths are session-based and end in a workspace landing page only after identity checks succeed.</text>

  <rect x="60" y="126" width="1080" height="292" class="panel"/>

  <rect x="90" y="178" width="180" height="64" class="primary"/>
  <text x="116" y="206" class="boxTitle">Member Password Login</text>
  <text x="116" y="224" class="boxText">Member number and password</text>

  <rect x="90" y="278" width="180" height="64" class="primary"/>
  <text x="116" y="306" class="boxTitle">Member OTP Login</text>
  <text x="116" y="324" class="boxText">Email code only</text>

  <rect x="332" y="178" width="180" height="64" class="primary"/>
  <text x="358" y="206" class="boxTitle">Staff Password Login</text>
  <text x="358" y="224" class="boxText">Staff number and password</text>

  <rect x="332" y="278" width="180" height="64" class="primary"/>
  <text x="358" y="306" class="boxTitle">Staff OTP Login</text>
  <text x="358" y="324" class="boxText">Email code only</text>

  <polygon points="628,210 708,170 788,210 708,250" class="decision"/>
  <text x="662" y="205" class="boxTitle">Privileged</text>
  <text x="669" y="223" class="boxTitle">staff role?</text>

  <rect x="840" y="150" width="210" height="84" class="secondary"/>
  <text x="868" y="182" class="boxTitle">Staff MFA Step-Up</text>
  <text x="868" y="201" class="boxText">Admin-class accounts enter a second</text>
  <text x="868" y="218" class="boxText">email OTP before session access is granted</text>

  <rect x="840" y="266" width="210" height="84" class="primary"/>
  <text x="868" y="297" class="boxTitle">Workspace Session Starts</text>
  <text x="868" y="316" class="boxText">Role landing page, claims, and tenant scope</text>
  <text x="868" y="333" class="boxText">become active only after verification</text>

  <path d="M270 210 L332 210" class="arrow"/>
  <path d="M270 310 L332 310" class="arrow"/>
  <path d="M512 210 L628 210" class="arrow"/>
  <path d="M512 310 L708 310 L708 250" class="arrow"/>
  <path d="M788 210 L840 210" class="arrow"/>
  <path d="M708 250 L708 308 L840 308" class="arrow"/>
  <path d="M1050 234 L1050 266" class="arrow"/>

  <text x="718" y="188" class="boxText">Yes</text>
  <text x="718" y="300" class="boxText">No</text>
</svg>

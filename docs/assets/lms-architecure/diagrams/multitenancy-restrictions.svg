<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Multitenancy restrictions</title>
  <desc id="desc">Shared database design with platform admin separation and SACCO workspace restrictions.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font: 700 29px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #4c6570; }
      .card { fill: #ffffff; stroke: #c8d9e4; stroke-width: 2; rx: 24; }
      .platform { fill: #fff7f2; stroke: #dc8c56; stroke-width: 2; rx: 18; }
      .workspace { fill: #eef7f8; stroke: #2d7a87; stroke-width: 2; rx: 18; }
      .database { fill: #f5f7f9; stroke: #88a3b0; stroke-width: 2; rx: 18; }
      .cardTitle { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #163942; }
      .text { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #4c6570; }
      .arrow { stroke: #6f93a2; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6f93a2"/>
    </marker>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <text x="70" y="66" class="title">Multitenancy Restriction Model</text>
  <text x="70" y="94" class="subtitle">The application uses one shared database while enforcing SACCO-specific boundaries at session, policy, and workflow levels.</text>

  <rect x="60" y="120" width="1080" height="340" class="card"/>

  <rect x="100" y="164" width="250" height="110" class="platform"/>
  <text x="126" y="195" class="cardTitle">Super Admin Identity</text>
  <text x="126" y="216" class="text">Role: ADMIN</text>
  <text x="126" y="236" class="text">Platform-only powers: tenant registry, oversight,</text>
  <text x="126" y="254" class="text">minor-admin creation, platform dashboards</text>

  <rect x="100" y="310" width="250" height="110" class="platform"/>
  <text x="126" y="341" class="cardTitle">Workspace Admin Identity</text>
  <text x="126" y="362" class="text">Role: MINOR_ADMIN</text>
  <text x="126" y="382" class="text">Confined to one SACCO and one station scope</text>
  <text x="126" y="400" class="text">Cannot perform platform-wide administration</text>

  <rect x="430" y="150" width="300" height="125" class="workspace"/>
  <text x="456" y="183" class="cardTitle">SACCO Workspace Rules</text>
  <text x="456" y="205" class="text">Members carry fixed SACCO and station identity</text>
  <text x="456" y="225" class="text">Managers and chairpersons act only inside the loan SACCO</text>
  <text x="456" y="245" class="text">Board members can act only on assigned reviews</text>

  <rect x="430" y="305" width="300" height="115" class="workspace"/>
  <text x="456" y="338" class="cardTitle">Session Scope Behavior</text>
  <text x="456" y="360" class="text">Minor-admin sessions store SACCO and station scope</text>
  <text x="456" y="380" class="text">Admin routes require scope selection before workspace work</text>
  <text x="456" y="398" class="text">Super Admin bypasses workspace session scoping</text>

  <rect x="810" y="214" width="250" height="130" class="database"/>
  <text x="836" y="246" class="cardTitle">Shared Database</text>
  <text x="836" y="269" class="text">Tenant-aware records carry SACCO identity</text>
  <text x="836" y="289" class="text">Workflow services compare actor SACCO with</text>
  <text x="836" y="307" class="text">loan, member, and queue ownership before action</text>

  <path d="M350 220 L430 220" class="arrow"/>
  <path d="M350 364 L430 364" class="arrow"/>
  <path d="M730 220 L810 250" class="arrow"/>
  <path d="M730 362 L810 310" class="arrow"/>
</svg>
